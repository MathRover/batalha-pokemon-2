<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batalha Pokémon</title>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f2f2f2, #d9e4f5);
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
    }

    h1 {
      margin: 30px 0 10px;
      font-size: 3rem;
      color: #fff700;
      text-shadow: 2px 2px 8px #e60202;
      animation: fadeDown 1s ease-in-out;
      text-align: center;
    }

    h2 {
      margin-bottom: 15px;
      color: #444;
    }

    /* ===== POKÉBOLA TRANSPARENTE ===== */
    .pokeball {
      width: 120px;
      margin-bottom: 20px;
      animation: fadeDown 1s ease-in-out;
      opacity: 0.8;
      transition: opacity 0.4s, filter 0.4s, transform 0.3s;
    }

    .pokeball:hover {
      transform: scale(1.1) rotate(10deg);
    }

    body.dark .pokeball {
      opacity: 0.5;
      filter: brightness(1.3);
    }

    /* ===== MENU ===== */
    .menu {
      background: rgba(255,255,255,0.95);
      padding: 25px 40px;
      border-radius: 25px;
      box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      transition: background 0.4s, color 0.4s;
      animation: fadeUp 1s ease-in-out;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.3s, opacity 0.3s, box-shadow 0.3s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-3px) scale(1.05);
      opacity: 0.95;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.25);
    }

    .play-btn { background: #4CAF50; color: white; }
    .exit-btn { background: #ff3b30; color: white; }
    .darkmode-btn { background: #222; color: #fff; }

    /* ===== ARENA POKÉMON ===== */
    .arena {
      display: none;
      flex-direction: row;
      justify-content: center;
      gap: 40px;
      margin-top: 60px;
      flex-wrap: wrap;
      animation: fadeIn 1s ease-in-out;
    }

    .pokemon-card {
      background: rgba(255,255,255,0.9);
      border-radius: 25px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.25);
      padding: 20px;
      width: 220px;
      text-align: center;
      transition: background 0.4s, transform 0.3s;
    }

    .pokemon-card:hover {
      transform: translateY(-5px) scale(1.05);
    }

    .pokemon-card img {
      width: 160px;
      height: 160px;
      transition: transform 0.3s;
    }

    .pokemon-card img:hover {
      transform: scale(1.1);
    }

    .pokemon-name {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
      color: #333;
    }

    /* ===== DARK MODE ===== */
    body.dark {
      background: linear-gradient(135deg, #121212, #1e1e1e);
      color: #f2f2f2;
    }

    body.dark .menu {
      background-color: rgba(30,30,30,0.95);
      color: #fff;
    }

    body.dark .pokemon-card {
      background-color: rgba(30,30,30,0.95);
      color: #fff;
    }

    body.dark .darkmode-btn {
      background-color: #f2f2f2;
      color: #121212;
    }

    /* ===== ANIMAÇÕES ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body> 
  <h1>⚡ Batalha Pokémon ⚡</h1>

  <img src="../testeframwork/templates/imagens/pokebola.png"
       alt="Pokebola" class="pokeball"> 

  <div class="menu">
    <h2>Menu Inicial</h2>
    <div class="buttons">
      <button class="play-btn" onclick="startGame()">▶ Jogar</button>
      <button class="exit-btn" onclick="window.close()">✖ Sair</button>
      <button class="darkmode-btn" onclick="toggleDarkMode()">🌙 Modo Escuro</button>
    </div>
  </div>

  <div class="arena" id="arena">
    <div class="pokemon-card">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu">
      <div class="pokemon-name">⚡ Pikachu</div>
    </div>
    <div class="pokemon-card">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Bulbasaur">
      <div class="pokemon-name">🌱 Bulbasaur</div>
    </div>
  </div>

  <script>
    function startGame() {
      document.getElementById("arena").style.display = "flex";
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
